<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Deutsch - Vietnamesisch Memory Matcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      body {
        height: auto;
        min-height: 100%;
        align-items: flex-start;
      }
      #game-container {
        width: 100%;
        height: 600px !important;
        max-height: 600px !important;
        margin: 0 auto;
      }
    }

    canvas {
      display: block;
      touch-action: none;
    }
    
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(5px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-box {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      max-height: 90%;
      display: flex;
      flex-direction: column;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-box h2 {
      color: #38bdf8;
      font-size: 1.15rem;
      margin-bottom: 8px;
      text-align: center;
    }
    .modal-box p {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 12px;
      line-height: 1.35;
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 160px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #f8fafc;
      padding: 10px;
      font-family: monospace;
      font-size: 0.85rem;
      resize: none;
      outline: none;
      white-space: pre;
      user-select: text;
      -webkit-user-select: text;
    }
    textarea:focus {
      border-color: #38bdf8;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn:active {
      opacity: 0.8;
    }
    .btn-save { background: #0ea5e9; color: #fff; }
    .btn-preset { background: #475569; color: #f8fafc; }

    .setting-group {
      margin-bottom: 14px;
    }
    .setting-label {
      font-size: 0.88rem;
      font-weight: bold;
      color: #cbd5e1;
      margin-bottom: 8px;
      display: block;
    }
    .setting-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .setting-options-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .option-btn {
      padding: 8px 4px;
      background: #0f172a;
      border: 1.5px solid #475569;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .option-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <!-- MODAL NHẬP TỪ VỰNG -->
  <div id="vocab-modal" class="modal-overlay">
    <div class="modal-box">
      <h2>🇩🇪 Soạn Danh Sách Từ Vựng 🇻🇳</h2>
      <p>Mỗi dòng là 1 cặp: <b>Tiếng Đức, Tiếng Việt</b><br>(Dùng dấu phẩy <code>,</code> hoặc gạch ngang <code>-</code>)</p>
      <textarea id="vocab-input" spellcheck="false" placeholder="das Haus, ngôi nhà&#10;lernen, học tập&#10;der Baum, cái cây&#10;trinken, uống"></textarea>
      <div class="modal-actions">
        <button class="btn btn-preset" id="btn-default-vocab">Từ mẫu</button>
        <button class="btn btn-save" id="btn-save-vocab">Lưu & Đóng</button>
      </div>
    </div>
  </div>

  <!-- MODAL THIẾT LẬP CHẾ ĐỘ CHƠI -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-box">
      <h2>⚙️ Thiết Lập Trò Chơi</h2>
      
      <div class="setting-group" style="margin-top: 8px;">
        <span class="setting-label">👀 Xem trước bài lúc đầu:</span>
        <div class="setting-options" id="opt-preview">
          <button class="option-btn" data-val="0">Tắt</button>
          <button class="option-btn" data-val="10">10 giây</button>
          <button class="option-btn" data-val="15">15 giây</button>
          <button class="option-btn" data-val="20">20 giây</button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">⏱️ Thời gian ngửa bài khi lật:</span>
        <div class="setting-options-3" id="opt-flip-delay">
          <button class="option-btn" data-val="1000">1 giây</button>
          <button class="option-btn" data-val="2000">2 giây</button>
          <button class="option-btn" data-val="3000">3 giây</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-save" id="btn-save-settings">Đồng Ý</button>
      </div>
    </div>
  </div>
</div>

<script>
class SoundEngine {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playFlip() {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.08);
    } catch(e) {}
  }
  playMatch() {
    if (!this.ctx) return;
    try {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const startTime = this.ctx.currentTime + idx * 0.08;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.2, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.25);
      });
    } catch(e) {}
  }
  playMismatch() {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.2);
    } catch(e) {}
  }
  playWin() {
    if (!this.ctx) return;
    try {
      const melody = [440, 554, 659, 880];
      melody.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const st = this.ctx.currentTime + idx * 0.12;
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, st);
        gain.gain.setValueAtTime(0.15, st);
        gain.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(st);
        osc.stop(st + 0.35);
      });
    } catch(e) {}
  }
  playLose() {
    if (!this.ctx) return;
    try {
      const melody = [300, 260, 220, 180];
      melody.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const st = this.ctx.currentTime + idx * 0.14;
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, st);
        gain.gain.setValueAtTime(0.2, st);
        gain.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(st);
        osc.stop(st + 0.35);
      });
    } catch(e) {}
  }
}

class Particle {
  constructor(x, y, color, speedMultiplier = 1.0) {
    this.x = x;
    this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = (Math.random() * 5 + 3) * speedMultiplier;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.size = Math.random() * 4 + 3;
    this.alpha = 1.0;
    this.decay = Math.random() * 0.02 + 0.015;
  }
  update(dt) {
    this.x += this.vx * (dt * 60);
    this.y += this.vy * (dt * 60);
    this.vy += 0.12 * (dt * 60);
    this.alpha -= this.decay * (dt * 60);
  }
  draw(ctx) {
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class FloatingText {
  constructor(x, y, text, color, fontSize) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.fontSize = fontSize || 18;
    this.alpha = 1.0;
    this.vy = -1.5;
  }
  update(dt) {
    this.y += this.vy * (dt * 60);
    this.alpha -= 0.015 * (dt * 60);
  }
  draw(ctx) {
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.font = 'bold ' + this.fontSize + 'px sans-serif';
    ctx.fillStyle = this.color;
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(this.text, this.x, this.y);
    ctx.fillText(this.text, this.x, this.y);
    ctx.restore();
  }
}

class VocabCard {
  constructor(id, pairId, lang, text) {
    this.id = id;
    this.pairId = pairId;
    this.lang = lang;
    this.text = text;
    this.x = 0;
    this.y = 0;
    this.width = 0;
    this.height = 0;
    this.isFlipped = false;
    this.isMatched = false;
    this.flipProgress = 0;
  }

  updateLayout(x, y, width, height) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
  }

  update(dt) {
    const speed = 7.0;
    if (this.isFlipped || this.isMatched) {
      if (this.flipProgress < 1) this.flipProgress = Math.min(1, this.flipProgress + speed * dt);
    } else {
      if (this.flipProgress > 0) this.flipProgress = Math.max(0, this.flipProgress - speed * dt);
    }
  }

  draw(ctx) {
    if (this.isMatched && this.flipProgress === 1) {
      ctx.globalAlpha = 0.35;
    }

    ctx.save();
    ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

    const cosVal = Math.cos(this.flipProgress * Math.PI);
    const absScaleX = Math.max(0.001, Math.abs(cosVal));
    ctx.scale(absScaleX, 1);

    const w = this.width;
    const h = this.height;
    const radius = Math.max(4, Math.min(w, h) * 0.1);

    if (this.flipProgress < 0.5) {
      const grad = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
      grad.addColorStop(0, '#1e3a8a');
      grad.addColorStop(1, '#3b82f6');
      ctx.fillStyle = grad;
      ctx.strokeStyle = '#60a5fa';
      ctx.lineWidth = Math.max(1, Math.min(w, h) * 0.035);
      this.roundRect(ctx, -w / 2, -h / 2, w, h, radius, true, true);

      const iconSize = Math.max(8, Math.min(13, Math.floor(w * 0.15)));
      ctx.font = 'bold ' + iconSize + 'px sans-serif';
      ctx.fillStyle = '#93c5fd';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🇩🇪 🇻🇳', 0, 0);
    } else {
      const isDe = this.lang === 'DE';
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = this.isMatched ? '#22c55e' : (isDe ? '#0284c7' : '#ea580c');
      ctx.lineWidth = Math.max(1.5, Math.min(w, h) * 0.045);
      this.roundRect(ctx, -w / 2, -h / 2, w, h, radius, true, true);

      // Căn giữa cờ ở phía trên thẻ bài
      const flag = isDe ? '🇩🇪' : '🇻🇳';
      const flagSize = Math.max(9, Math.min(14, Math.floor(Math.min(w, h) * 0.18)));
      ctx.font = flagSize + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(flag, 0, -h / 2 + flagSize * 0.9);

      const safeW = w * 0.86;
      const safeH = h * 0.60;
      this.drawWord(ctx, this.text, 0, flagSize * 0.45, safeW, safeH, isDe ? '#0369a1' : '#c2410c');
    }

    ctx.restore();
    ctx.globalAlpha = 1.0;
  }

  drawWord(ctx, text, cx, cy, maxW, maxH, color) {
    let fontSize = Math.min(maxH * 0.35, maxW * 0.22);
    fontSize = Math.max(9, Math.min(fontSize, 20));

    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const words = text.split(' ');
    let lines = [];

    const fitLines = (fSize) => {
      ctx.font = 'bold ' + fSize + 'px sans-serif';
      lines = [];
      let currentLine = words[0];
      for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = ctx.measureText(currentLine + " " + word).width;
        if (width <= maxW) {
          currentLine += " " + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);
    };

    fitLines(fontSize);

    let lineHeight = fontSize * 1.2;
    let totalH = lines.length * lineHeight;
    while ((totalH > maxH || lines.some(l => ctx.measureText(l).width > maxW)) && fontSize > 7.5) {
      fontSize -= 0.5;
      fitLines(fontSize);
      lineHeight = fontSize * 1.15;
      totalH = lines.length * lineHeight;
    }

    const startY = cy - ((lines.length - 1) * lineHeight) / 2;
    lines.forEach((line, idx) => {
      ctx.fillText(line, cx, startY + idx * lineHeight);
    });
  }

  roundRect(ctx, x, y, width, height, radius, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  contains(px, py) {
    return px >= this.x && px <= this.x + this.width &&
           py >= this.y && py <= this.y + this.height;
  }
}

class GameManager {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.sound = new SoundEngine();

    this.width = 360;
    this.height = 600;
    this.dpr = window.devicePixelRatio || 1;

    this.state = 'MENU';
    this.mode = 'AI';
    this.difficulty = 'EASY';

    this.previewTime = 0;
    this.flipDelay = 1000;
    this.isPreviewing = false;
    this.previewRemaining = 0;

    this.animTimer = 0;
    this.isUserWon = true;

    this.vocabList = [...DEFAULT_VOCAB];
    this.cards = [];
    this.flippedCards = [];
    this.players = [];
    this.currentPlayerIdx = 0;
    this.lockBoard = false;
    this.totalPairs = 0;
    this.matchedPairs = 0;

    this.aiMemory = new Map();
    this.particles = [];
    this.floatingTexts = [];
    this.menuHitboxes = [];
    this.homeBtnHitbox = null;
    this.lastTime = performance.now();

    this.setupResize();
    this.bindEvents();
    this.setupModals();
    this.loop();
  }

  setupModals() {
    const vocabModal = document.getElementById('vocab-modal');
    const textarea = document.getElementById('vocab-input');
    const btnSaveVocab = document.getElementById('btn-save-vocab');
    const btnPreset = document.getElementById('btn-default-vocab');

    const updateTextarea = () => {
      textarea.value = this.vocabList.map(item => item.de + ', ' + item.vi).join('\n');
    };
    updateTextarea();

    btnPreset.addEventListener('click', () => {
      this.vocabList = [...DEFAULT_VOCAB];
      updateTextarea();
    });

    btnSaveVocab.addEventListener('click', () => {
      const lines = textarea.value.split('\n');
      const parsed = [];
      lines.forEach(line => {
        const cleaned = line.trim();
        if (!cleaned) return;
        let parts = cleaned.split(/[,;\-\t]/);
        if (parts.length >= 2) {
          const de = parts[0].trim();
          const vi = parts.slice(1).join(', ').trim();
          if (de && vi) parsed.push({ de, vi });
        }
      });

      if (parsed.length < 8) {
        alert('Vui lòng nhập ít nhất 8 cặp từ!');
        return;
      }

      this.vocabList = parsed;
      vocabModal.style.display = 'none';
      this.sound.playMatch();
    });

    const settingsModal = document.getElementById('settings-modal');
    const btnSaveSettings = document.getElementById('btn-save-settings');
    const optPreviewBtns = document.querySelectorAll('#opt-preview .option-btn');
    const optFlipBtns = document.querySelectorAll('#opt-flip-delay .option-btn');

    const updateSettingsUI = () => {
      optPreviewBtns.forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.val) === this.previewTime);
      });
      optFlipBtns.forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.val) === this.flipDelay);
      });
    };
    updateSettingsUI();

    optPreviewBtns.forEach(b => {
      b.addEventListener('click', () => {
        this.previewTime = parseInt(b.dataset.val);
        updateSettingsUI();
        this.sound.playFlip();
      });
    });

    optFlipBtns.forEach(b => {
      b.addEventListener('click', () => {
        this.flipDelay = parseInt(b.dataset.val);
        updateSettingsUI();
        this.sound.playFlip();
      });
    });

    btnSaveSettings.addEventListener('click', () => {
      settingsModal.style.display = 'none';
      this.sound.playMatch();
    });
  }

  openVocabModal() {
    document.getElementById('vocab-modal').style.display = 'flex';
  }

  openSettingsModal() {
    document.getElementById('settings-modal').style.display = 'flex';
  }

  setupResize() {
    const handleResize = () => {
      const container = document.getElementById('game-container') || document.body;
      const rect = container.getBoundingClientRect();
      this.width = rect.width || window.innerWidth || 360;
      this.height = rect.height || 600;
      this.dpr = window.devicePixelRatio || 1;

      this.canvas.width = Math.floor(this.width * this.dpr);
      this.canvas.height = Math.floor(this.height * this.dpr);
      this.canvas.style.width = this.width + 'px';
      this.canvas.style.height = this.height + 'px';

      if (this.ctx.resetTransform) {
        this.ctx.resetTransform();
      } else {
        this.ctx.setTransform(1, 0, 0, 1, 0, 0);
      }
      this.ctx.scale(this.dpr, this.dpr);

      if (this.state === 'PLAYING') {
        this.recalculateGridLayout();
      }
    };

    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', () => {
      setTimeout(handleResize, 150);
    });
    handleResize();
  }

  bindEvents() {
    const triggerAction = (clientX, clientY) => {
      this.sound.init();
      const rect = this.canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      this.handleClick(x, y);
    };

    this.canvas.addEventListener('mousedown', (e) => triggerAction(e.clientX, e.clientY));
    this.canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (e.touches.length > 0) {
        triggerAction(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });
  }

  initGame() {
    this.cards = [];
    this.flippedCards = [];
    this.particles = [];
    this.floatingTexts = [];
    this.aiMemory.clear();
    this.lockBoard = false;
    this.matchedPairs = 0;

    if (this.mode === 'AI') {
      this.players = [
        { name: 'Bạn', score: 0, color: '#38bdf8', isAI: false },
        { name: 'DNZ', score: 0, color: '#f43f5e', isAI: true }
      ];
    } else if (this.mode === 'P2') {
      this.players = [
        { name: 'Người 1', score: 0, color: '#38bdf8', isAI: false },
        { name: 'Người 2', score: 0, color: '#f43f5e', isAI: false }
      ];
    } else {
      this.players = [
        { name: 'Người 1', score: 0, color: '#38bdf8', isAI: false },
        { name: 'Người 2', score: 0, color: '#f43f5e', isAI: false },
        { name: 'Người 3', score: 0, color: '#facc15', isAI: false }
      ];
    }
    this.currentPlayerIdx = 0;

    let totalCards = 16;
    if (this.difficulty === 'MEDIUM') totalCards = 30;
    if (this.difficulty === 'HARD') totalCards = 50;

    this.totalPairs = totalCards / 2;

    const shuffledPool = [...this.vocabList].sort(() => Math.random() - 0.5);
    const selectedPairs = [];
    for (let i = 0; i < this.totalPairs; i++) {
      selectedPairs.push({
        pairId: i,
        ...shuffledPool[i % shuffledPool.length]
      });
    }

    const cardDataList = [];
    selectedPairs.forEach(p => {
      cardDataList.push({ pairId: p.pairId, lang: 'DE', text: p.de });
      cardDataList.push({ pairId: p.pairId, lang: 'VI', text: p.vi });
    });

    for (let i = cardDataList.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const temp = cardDataList[i];
      cardDataList[i] = cardDataList[j];
      cardDataList[j] = temp;
    }

    cardDataList.forEach((c, idx) => {
      this.cards.push(new VocabCard(idx, c.pairId, c.lang, c.text));
    });

    this.recalculateGridLayout();
    this.state = 'PLAYING';

    if (this.previewTime > 0) {
      this.isPreviewing = true;
      this.previewRemaining = this.previewTime;
      this.lockBoard = true;
      this.cards.forEach(c => c.isFlipped = true);

      const interval = setInterval(() => {
        if (this.state !== 'PLAYING' || !this.isPreviewing) {
          clearInterval(interval);
          return;
        }
        this.previewRemaining--;
        if (this.previewRemaining <= 0) {
          clearInterval(interval);
          this.isPreviewing = false;
          this.lockBoard = false;
          this.cards.forEach(c => c.isFlipped = false);
          this.sound.playFlip();
        }
      }, 1000);
    } else {
      this.isPreviewing = false;
      this.lockBoard = false;
    }
  }

  recalculateGridLayout() {
    if (this.cards.length === 0) return;
    const isPortrait = this.height > this.width;
    let cols = 4, rows = 4;

    if (this.difficulty === 'MEDIUM') {
      cols = isPortrait ? 5 : 6;
      rows = isPortrait ? 6 : 5;
    } else if (this.difficulty === 'HARD') {
      cols = isPortrait ? 5 : 10;
      rows = isPortrait ? 10 : 5;
    }

    const headerH = Math.max(46, Math.min(64, this.height * 0.09));
    const paddingX = Math.max(6, Math.min(14, this.width * 0.025));
    const paddingY = Math.max(6, Math.min(14, this.height * 0.02));
    const gap = Math.max(4, Math.min(8, Math.min(this.width, this.height) * 0.015));

    const availW = this.width - paddingX * 2;
    const availH = this.height - headerH - paddingY * 2;

    const cardW = Math.floor((availW - (cols - 1) * gap) / cols);
    const cardH = Math.floor((availH - (rows - 1) * gap) / rows);

    const totalGridW = cols * cardW + (cols - 1) * gap;
    const totalGridH = rows * cardH + (rows - 1) * gap;

    const startX = (this.width - totalGridW) / 2;
    const startY = headerH + (availH - totalGridH) / 2 + paddingY;

    let idx = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (idx < this.cards.length) {
          const x = startX + c * (cardW + gap);
          const y = startY + r * (cardH + gap);
          this.cards[idx].updateLayout(x, y, cardW, cardH);
          idx++;
        }
      }
    }
  }

  handleClick(x, y) {
    if (this.state === 'MENU') {
      for (let i = 0; i < this.menuHitboxes.length; i++) {
        const btn = this.menuHitboxes[i];
        if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
          if (btn.type === 'mode') {
            this.mode = btn.val;
            this.sound.playFlip();
          } else if (btn.type === 'diff') {
            this.difficulty = btn.val;
            this.sound.playFlip();
          } else if (btn.type === 'vocab') {
            this.sound.playFlip();
            this.openVocabModal();
          } else if (btn.type === 'settings') {
            this.sound.playFlip();
            this.openSettingsModal();
          } else if (btn.type === 'start') {
            this.sound.playMatch();
            this.initGame();
          }
          break;
        }
      }
    } else if (this.state === 'PLAYING') {
      if (this.homeBtnHitbox && 
          x >= this.homeBtnHitbox.x && x <= this.homeBtnHitbox.x + this.homeBtnHitbox.w &&
          y >= this.homeBtnHitbox.y && y <= this.homeBtnHitbox.y + this.homeBtnHitbox.h) {
        this.sound.playFlip();
        this.isPreviewing = false;
        this.state = 'MENU';
        return;
      }

      if (this.lockBoard || this.isPreviewing) return;
      if (this.players[this.currentPlayerIdx].isAI) return;

      for (let i = 0; i < this.cards.length; i++) {
        const card = this.cards[i];
        if (card.contains(x, y)) {
          this.flipCard(card);
          break;
        }
      }
    } else if (this.state === 'GAME_OVER') {
      this.state = 'MENU';
    }
  }

  flipCard(card) {
    if (card.isFlipped || card.isMatched || this.lockBoard) return;
    if (this.flippedCards.length >= 2) return;

    card.isFlipped = true;
    this.flippedCards.push(card);
    this.sound.playFlip();

    this.aiMemory.set(card.id, { pairId: card.pairId, lang: card.lang });

    if (this.flippedCards.length === 2) {
      this.checkMatch();
    }
  }

  checkMatch() {
    this.lockBoard = true;
    const c1 = this.flippedCards[0];
    const c2 = this.flippedCards[1];
    const isPair = (c1.pairId === c2.pairId) && (c1.lang !== c2.lang);

    if (isPair) {
      setTimeout(() => {
        c1.isMatched = true;
        c2.isMatched = true;
        this.players[this.currentPlayerIdx].score += 100;
        this.matchedPairs++;

        this.sound.playMatch();
        this.triggerMatchVFX(c1, c2);

        this.flippedCards = [];
        this.lockBoard = false;

        if (this.matchedPairs === this.totalPairs) {
          this.startVictoryAnimation();
        } else if (this.players[this.currentPlayerIdx].isAI) {
          setTimeout(() => this.makeAiMove(), 500);
        }
      }, 450);
    } else {
      setTimeout(() => {
        this.sound.playMismatch();
        c1.isFlipped = false;
        c2.isFlipped = false;
        this.flippedCards = [];
        this.lockBoard = false;

        this.currentPlayerIdx = (this.currentPlayerIdx + 1) % this.players.length;
        if (this.players[this.currentPlayerIdx].isAI) {
          setTimeout(() => this.makeAiMove(), 650);
        }
      }, this.flipDelay);
    }
  }

  makeAiMove() {
    if (this.state !== 'PLAYING' || !this.players[this.currentPlayerIdx].isAI || this.lockBoard || this.isPreviewing) return;

    const unmatched = this.cards.filter(c => !c.isMatched && !c.isFlipped);
    if (unmatched.length === 0) return;

    const pairMap = new Map();
    for (let [cId, info] of this.aiMemory.entries()) {
      const card = this.cards.find(c => c.id === cId);
      if (card && !card.isMatched) {
        if (!pairMap.has(info.pairId)) pairMap.set(info.pairId, []);
        pairMap.get(info.pairId).push(card);
      }
    }

    let pairToPick = null;
    for (let [, list] of pairMap.entries()) {
      if (list.length >= 2 && list[0].lang !== list[1].lang) {
        pairToPick = [list[0], list[1]];
        break;
      }
    }

    if (pairToPick) {
      this.flipCard(pairToPick[0]);
      setTimeout(() => {
        if (this.state === 'PLAYING') this.flipCard(pairToPick[1]);
      }, 500);
      return;
    }

    const unknown = unmatched.filter(c => !this.aiMemory.has(c.id));
    const firstChoice = unknown.length > 0
      ? unknown[Math.floor(Math.random() * unknown.length)]
      : unmatched[Math.floor(Math.random() * unmatched.length)];

    this.flipCard(firstChoice);

    setTimeout(() => {
      if (this.state !== 'PLAYING' || this.flippedCards.length !== 1) return;

      const targetPairId = firstChoice.pairId;
      const targetLang = firstChoice.lang === 'DE' ? 'VI' : 'DE';
      let secondChoice = null;

      for (let [cId, info] of this.aiMemory.entries()) {
        if (cId !== firstChoice.id && info.pairId === targetPairId && info.lang === targetLang) {
          const matchCard = this.cards.find(c => c.id === cId);
          if (matchCard && !matchCard.isMatched) {
            secondChoice = matchCard;
            break;
          }
        }
      }

      if (!secondChoice) {
        const remaining = this.cards.filter(c => !c.isMatched && !c.isFlipped);
        const remUnknown = remaining.filter(c => !this.aiMemory.has(c.id));
        secondChoice = remUnknown.length > 0
          ? remUnknown[Math.floor(Math.random() * remUnknown.length)]
          : remaining[Math.floor(Math.random() * remaining.length)];
      }

      if (secondChoice) this.flipCard(secondChoice);
    }, 600);
  }

  triggerMatchVFX(c1, c2) {
    const colors = ['#38bdf8', '#fbbf24', '#4ade80', '#f43f5e', '#ffffff'];
    const fontSize = Math.max(14, Math.min(22, this.width * 0.045));
    [c1, c2].forEach(c => {
      const cx = c.x + c.width / 2;
      const cy = c.y + c.height / 2;
      for (let i = 0; i < 12; i++) {
        const col = colors[Math.floor(Math.random() * colors.length)];
        this.particles.push(new Particle(cx, cy, col));
      }
      this.floatingTexts.push(new FloatingText(cx, cy, '+100đ', '#facc15', fontSize));
    });
  }

  startVictoryAnimation() {
    this.state = 'VICTORY_ANIM';
    this.animTimer = 0;

    let maxScore = -1;
    this.players.forEach(p => { if (p.score > maxScore) maxScore = p.score; });

    if (this.mode === 'AI') {
      const userPlayer = this.players[0];
      const aiPlayer = this.players[1];
      this.isUserWon = userPlayer.score >= aiPlayer.score;
    } else {
      this.isUserWon = true;
    }

    if (this.isUserWon) {
      this.sound.playWin();
      const colors = ['#38bdf8', '#fbbf24', '#4ade80', '#f43f5e', '#a855f7', '#ffffff'];
      for (let i = 0; i < 75; i++) {
        const px = Math.random() * this.width;
        const py = Math.random() * this.height * 0.6;
        const col = colors[Math.floor(Math.random() * colors.length)];
        this.particles.push(new Particle(px, py, col, 1.4));
      }
    } else {
      this.sound.playLose();
    }
  }

  endGame() {
    this.state = 'GAME_OVER';
  }

  update(dt) {
    this.cards.forEach(c => c.update(dt));
    for (let i = this.particles.length - 1; i >= 0; i--) {
      this.particles[i].update(dt);
      if (this.particles[i].alpha <= 0) this.particles.splice(i, 1);
    }
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      this.floatingTexts[i].update(dt);
      if (this.floatingTexts[i].alpha <= 0) this.floatingTexts.splice(i, 1);
    }

    if (this.state === 'VICTORY_ANIM') {
      this.animTimer += dt;
      if (this.animTimer >= 1.0) {
        this.endGame();
      }
    }
  }

  render() {
    this.ctx.clearRect(0, 0, this.width, this.height);

    if (this.state === 'MENU') {
      this.renderMenu();
    } else if (this.state === 'PLAYING') {
      this.renderHeader();
      this.cards.forEach(c => c.draw(this.ctx));
      this.particles.forEach(p => p.draw(this.ctx));
      this.floatingTexts.forEach(t => t.draw(this.ctx));

      if (this.isPreviewing) {
        this.renderPreviewBanner();
      }
    } else if (this.state === 'VICTORY_ANIM') {
      this.renderVictoryAnimation();
    } else if (this.state === 'GAME_OVER') {
      this.renderHeader();
      this.cards.forEach(c => c.draw(this.ctx));
      this.particles.forEach(p => p.draw(this.ctx));
      this.floatingTexts.forEach(t => t.draw(this.ctx));
      this.renderGameOver();
    }
  }

  renderVictoryAnimation() {
    const ctx = this.ctx;
    const progress = Math.min(1.0, this.animTimer / 1.0);

    ctx.save();
    if (!this.isUserWon) {
      const shakeAmp = (1 - progress) * 8;
      const offsetX = (Math.random() - 0.5) * shakeAmp;
      const offsetY = (Math.random() - 0.5) * shakeAmp;
      ctx.translate(offsetX, offsetY);
    }

    this.renderHeader();
    this.cards.forEach(c => c.draw(ctx));
    this.particles.forEach(p => p.draw(ctx));

    ctx.fillStyle = `rgba(15, 23, 42, ${0.45 * Math.min(1, progress * 2)})`;
    ctx.fillRect(0, 0, this.width, this.height);

    const cx = this.width / 2;
    const cy = this.height / 2;

    let scale = 1.0;
    if (progress < 0.25) {
      scale = (progress / 0.25) * 1.25;
    } else if (progress < 0.45) {
      scale = 1.25 - ((progress - 0.25) / 0.2) * 0.25;
    } else {
      scale = 1.0;
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    if (this.isUserWon) {
      ctx.font = '54px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🎉', 0, -32);

      ctx.fillStyle = '#facc15';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4;
      ctx.font = 'bold ' + Math.max(22, Math.min(32, this.width * 0.08)) + 'px sans-serif';
      ctx.strokeText('CHIẾN THẮNG!', 0, 26);
      ctx.fillText('CHIẾN THẮNG!', 0, 26);
    } else {
      ctx.font = '54px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('😢', 0, -32);

      ctx.fillStyle = '#f43f5e';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4;
      ctx.font = 'bold ' + Math.max(20, Math.min(30, this.width * 0.075)) + 'px sans-serif';
      ctx.strokeText('CHƯA THÀNH CÔNG!', 0, 26);
      ctx.fillText('CHƯA THÀNH CÔNG!', 0, 26);
    }

    ctx.restore();
    ctx.restore();
  }

  renderPreviewBanner() {
    const ctx = this.ctx;
    const bannerH = 34;
    const bannerY = Math.max(46, Math.min(64, this.height * 0.09)) + 6;
    
    ctx.fillStyle = 'rgba(234, 88, 12, 0.9)';
    ctx.strokeStyle = '#fdba74';
    ctx.lineWidth = 1.5;
    
    const bannerW = Math.min(this.width * 0.84, 320);
    const startX = (this.width - bannerW) / 2;
    
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(startX, bannerY, bannerW, bannerH, 8) : ctx.rect(startX, bannerY, bannerW, bannerH);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`👀 Ghi nhớ nhanh! Còn lại: ${this.previewRemaining}s`, this.width / 2, bannerY + bannerH / 2);
  }

  renderMenu() {
    const ctx = this.ctx;
    this.menuHitboxes = [];

    const W = this.width;
    const H = this.height;
    const minDim = Math.min(W, H);

    ctx.fillStyle = '#38bdf8';
    const titleSize = Math.max(16, Math.min(24, minDim * 0.065));
    ctx.font = 'bold ' + titleSize + "px sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('DEUTSCH - VIETNAMESISCH', W / 2, H * 0.08);

    ctx.fillStyle = '#94a3b8';
    ctx.font = Math.max(10, Math.min(12, minDim * 0.028)) + "px sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Ghép cặp từ tương ứng Tiếng Đức 🇩🇪 - Tiếng Việt 🇻🇳', W / 2, H * 0.125);

    const btnW = Math.min(W * 0.88, 360);
    const btnH = Math.max(32, Math.min(38, H * 0.056));
    let curY = H * 0.165;

    const modes = [
      { id: 'AI', label: '🤖 Đấu với Máy (AI)' },
      { id: 'P2', label: '👥 2 Người chơi (Pass & Play)' },
      { id: 'P3', label: '👨‍👩‍👦 3 Người chơi (Pass & Play)' }
    ];

    modes.forEach(m => {
      const isSel = this.mode === m.id;
      const x = (W - btnW) / 2;
      ctx.fillStyle = isSel ? '#0284c7' : '#1e293b';
      ctx.strokeStyle = isSel ? '#38bdf8' : '#475569';
      ctx.lineWidth = 1.5;
      ctx.fillRect(x, curY, btnW, btnH);
      ctx.strokeRect(x, curY, btnW, btnH);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold ' + Math.max(11, Math.min(13.5, btnH * 0.4)) + "px sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(m.label, W / 2, curY + btnH / 2);

      this.menuHitboxes.push({ type: 'mode', val: m.id, x: x, y: curY, w: btnW, h: btnH });
      curY += btnH + Math.max(4, H * 0.01);
    });

    curY += Math.max(2, H * 0.005);

    const diffs = [
      { id: 'EASY', label: 'Dễ (4x4)' },
      { id: 'MEDIUM', label: 'Vừa (6x5)' },
      { id: 'HARD', label: 'Khó (10x5)' }
    ];
    const diffGap = 6;
    const diffW = (btnW - diffGap * 2) / 3;
    const diffH = btnH * 0.88;
    const diffStartX = (W - btnW) / 2;

    diffs.forEach((d, i) => {
      const isSel = this.difficulty === d.id;
      const x = diffStartX + i * (diffW + diffGap);
      ctx.fillStyle = isSel ? '#eab308' : '#1e293b';
      ctx.strokeStyle = isSel ? '#fef08a' : '#475569';
      ctx.lineWidth = 1.5;
      ctx.fillRect(x, curY, diffW, diffH);
      ctx.strokeRect(x, curY, diffW, diffH);

      ctx.fillStyle = isSel ? '#0f172a' : '#fff';
      ctx.font = 'bold ' + Math.max(10, Math.min(12, diffH * 0.4)) + "px sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(d.label, x + diffW / 2, curY + diffH / 2);

      this.menuHitboxes.push({ type: 'diff', val: d.id, x: x, y: curY, w: diffW, h: diffH });
    });

    curY += diffH + Math.max(5, H * 0.012);

    const rowGap = 8;
    const halfBtnW = (btnW - rowGap) / 2;
    const rowStartX = (W - btnW) / 2;

    // Nút Từ Vựng
    ctx.fillStyle = '#6366f1';
    ctx.strokeStyle = '#a5b4fc';
    ctx.lineWidth = 1.5;
    ctx.fillRect(rowStartX, curY, halfBtnW, btnH);
    ctx.strokeRect(rowStartX, curY, halfBtnW, btnH);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + Math.max(11, Math.min(13, btnH * 0.38)) + "px sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✏️ Từ Vựng (' + this.vocabList.length + ')', rowStartX + halfBtnW / 2, curY + btnH / 2);
    this.menuHitboxes.push({ type: 'vocab', x: rowStartX, y: curY, w: halfBtnW, h: btnH });

    // Nút Thiết Lập
    const setBtnX = rowStartX + halfBtnW + rowGap;
    ctx.fillStyle = '#0f766e';
    ctx.strokeStyle = '#2dd4bf';
    ctx.lineWidth = 1.5;
    ctx.fillRect(setBtnX, curY, halfBtnW, btnH);
    ctx.strokeRect(setBtnX, curY, halfBtnW, btnH);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + Math.max(11, Math.min(13, btnH * 0.38)) + "px sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⚙️ Thiết Lập', setBtnX + halfBtnW / 2, curY + btnH / 2);
    this.menuHitboxes.push({ type: 'settings', x: setBtnX, y: curY, w: halfBtnW, h: btnH });

    // Nút Bắt Đầu
    const startY = curY + btnH + Math.max(8, H * 0.018);
    const startH = Math.max(38, Math.min(46, H * 0.068));
    const startX = (W - btnW) / 2;

    ctx.fillStyle = '#16a34a';
    ctx.strokeStyle = '#86efac';
    ctx.lineWidth = 2;
    ctx.fillRect(startX, startY, btnW, startH);
    ctx.strokeRect(startX, startY, btnW, startH);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + Math.max(13, Math.min(16, startH * 0.42)) + "px sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('BẮT ĐẦU CHƠI ▶', W / 2, startY + startH / 2);

    this.menuHitboxes.push({ type: 'start', x: startX, y: startY, w: btnW, h: startH });
  }

  renderHeader() {
    const ctx = this.ctx;
    const headerH = Math.max(44, Math.min(64, this.height * 0.09));
    ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
    ctx.fillRect(0, 0, this.width, headerH);

    const homeBtnW = Math.max(44, Math.min(64, this.width * 0.14));
    const homeBtnH = headerH - 8;
    const homeBtnX = 6;
    const homeBtnY = 4;

    ctx.fillStyle = '#1e293b';
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(homeBtnX, homeBtnY, homeBtnW, homeBtnH, 8) : ctx.rect(homeBtnX, homeBtnY, homeBtnW, homeBtnH);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold ' + Math.max(10, Math.min(12, homeBtnH * 0.35)) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏠 Menu', homeBtnX + homeBtnW / 2, homeBtnY + homeBtnH / 2);

    this.homeBtnHitbox = { x: homeBtnX, y: homeBtnY, w: homeBtnW, h: homeBtnH };

    const playersAreaStartX = homeBtnX + homeBtnW + 6;
    const playersAreaW = this.width - playersAreaStartX;
    const spacing = playersAreaW / this.players.length;

    this.players.forEach((p, idx) => {
      const isCurrent = idx === this.currentPlayerIdx;
      const x = playersAreaStartX + idx * spacing + spacing / 2;

      if (isCurrent) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1.5;
        ctx.fillRect(playersAreaStartX + idx * spacing + 2, 4, spacing - 4, headerH - 8);
        ctx.strokeRect(playersAreaStartX + idx * spacing + 2, 4, spacing - 4, headerH - 8);
      }

      ctx.fillStyle = p.color;
      const nameSize = Math.max(10, Math.min(13, headerH * 0.26));
      ctx.font = (isCurrent ? 'bold ' : '') + nameSize + "px sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.name + (isCurrent ? ' 👉' : ''), x, headerH * 0.32);

      ctx.fillStyle = '#facc15';
      const scoreSize = Math.max(11, Math.min(15, headerH * 0.28));
      ctx.font = 'bold ' + scoreSize + "px sans-serif";
      ctx.fillText(p.score + 'đ', x, headerH * 0.72);
    });
  }

  renderGameOver() {
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
    ctx.fillRect(0, 0, this.width, this.height);

    let maxScore = -1;
    this.players.forEach(p => { if (p.score > maxScore) maxScore = p.score; });
    const winners = this.players.filter(p => p.score === maxScore);

    const W = this.width;
    const H = this.height;

    ctx.fillStyle = '#facc15';
    ctx.font = 'bold ' + Math.max(18, Math.min(28, W * 0.07)) + "px sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏆 BẢNG TỔNG KẾT 🏆', W / 2, H * 0.25);

    let winnerText = winners.length === this.players.length 
      ? 'HÒA NHAU! (' + maxScore + 'đ)' 
      : 'THẮNG: ' + winners.map(w => w.name).join(' & ') + ' (' + maxScore + 'đ)';

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold ' + Math.max(14, Math.min(18, W * 0.045)) + "px sans-serif";
    ctx.fillText(winnerText, W / 2, H * 0.35);

    let startY = H * 0.45;
    this.players.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.font = 'bold ' + Math.max(13, Math.min(16, W * 0.04)) + "px sans-serif";
      ctx.fillText(p.name + ': ' + p.score + ' điểm', W / 2, startY);
      startY += Math.max(22, H * 0.045);
    });

    ctx.fillStyle = '#94a3b8';
    ctx.font = Math.max(11, Math.min(14, W * 0.035)) + "px sans-serif";
    ctx.fillText('Chạm màn hình để quay lại Menu', W / 2, H * 0.85);
  }

  loop() {
    const now = performance.now();
    const dt = Math.min((now - this.lastTime) / 1000, 0.1);
    this.lastTime = now;

    this.update(dt);
    this.render();

    requestAnimationFrame(() => this.loop());
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    new GameManager(document.getElementById('gameCanvas'));
  });
} else {
  new GameManager(document.getElementById('gameCanvas'));
}
</script>
